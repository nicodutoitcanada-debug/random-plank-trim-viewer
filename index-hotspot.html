<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Model Viewer Hotspot Picker</title>

  <script
    type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #111;
    }

    model-viewer {
      width: 100vw;
      height: 100vh;
      background: #f4f4f4;
    }

    .panel {
      position: fixed;
      left: 16px;
      top: 16px;
      z-index: 9999;
      width: 390px;
      max-width: calc(100vw - 32px);
      background: rgba(0, 0, 0, 0.82);
      color: white;
      padding: 14px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.45;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
    }

    .panel h1 {
      margin: 0 0 8px;
      font-size: 16px;
    }

    .panel button {
      margin-top: 10px;
      padding: 8px 10px;
      border: 0;
      border-radius: 8px;
      background: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    .panel textarea {
      width: 100%;
      height: 145px;
      margin-top: 10px;
      resize: none;
      border: 0;
      border-radius: 8px;
      padding: 10px;
      box-sizing: border-box;
      font-size: 12px;
      font-family: Consolas, monospace;
    }

    .Hotspot {
      display: block;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 4px solid white;
      background: red;
      box-shadow: 0 0 22px rgba(255, 0, 0, 1);
      cursor: pointer;
      transform: translate(-50%, -50%);
    }

    .Hotspot::before {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      background: white;
    }

    .Hotspot::after {
      content: "";
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      border: 3px solid rgba(255, 0, 0, 0.5);
      animation: pulse 1.3s infinite;
    }

    .HotspotAnnotation {
      position: absolute;
      left: 50%;
      bottom: 62px;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
      pointer-events: none;
    }

    @keyframes pulse {
      0% {
        transform: scale(0.7);
        opacity: 0.8;
      }

      100% {
        transform: scale(1.7);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <div class="panel">
    <h1>Hotspot Picker</h1>
    <div>
      Hold <strong>Shift</strong> and click directly on the model where you want the hotspot.
      The red hotspot will move to that point, and the code below will update.
    </div>

    <button id="copyButton">Copy hotspot code</button>

    <textarea id="output" readonly>
Shift + click the model to generate hotspot code.
    </textarea>
  </div>

  <model-viewer
    id="viewer"
    src="RP-TRIM GUIDE test 17.glb"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    tone-mapping="neutral"
    poster="poster.webp"
    shadow-intensity="1"
    exposure="1"
  >

    <button
      id="hotspot"
      class="Hotspot"
      slot="hotspot-1"
      data-position="0m 0m 0m"
      data-normal="0m 1m 0m"
    >
      <div class="HotspotAnnotation">TERMINATE</div>
    </button>

  </model-viewer>

  <script>
  const viewer = document.querySelector("#viewer");
  const hotspot = document.querySelector("#hotspot");
  const output = document.querySelector("#output");
  const copyButton = document.querySelector("#copyButton");

  function formatVector(vector) {
    return `${vector.x.toFixed(5)}m ${vector.y.toFixed(5)}m ${vector.z.toFixed(5)}m`;
  }

  function updateHotspot(position, normal) {
    const positionString = formatVector(position);
    const normalString = formatVector(normal);

    hotspot.setAttribute("data-position", positionString);
    hotspot.setAttribute("data-normal", normalString);

    const code = `<button
  class="Hotspot"
  slot="hotspot-1"
  data-position="${positionString}"
  data-normal="${normalString}"
>
  <div class="HotspotAnnotation">TERMINATE</div>
</button>`;

    output.value = code;

    console.log("Hotspot position:", positionString);
    console.log("Hotspot normal:", normalString);
  }

  viewer.addEventListener("click", async (event) => {
    if (!event.shiftKey) return;

    const rect = viewer.getBoundingClientRect();
    const x = event.clientX - rect.left;
    const y = event.clientY - rect.top;

    const hit = await viewer.positionAndNormalFromPoint(x, y);

    if (!hit) {
      output.value = "No model surface was hit. Try clicking directly on the visible model.";
      return;
    }

    updateHotspot(hit.position, hit.normal);
  });

  copyButton.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(output.value);
      copyButton.textContent = "Copied!";
      setTimeout(() => {
        copyButton.textContent = "Copy hotspot code";
      }, 1200);
    } catch (error) {
      console.error(error);
      copyButton.textContent = "Copy failed";
    }
  });

  viewer.addEventListener("load", () => {
    console.log("Model loaded. Hold Shift and click the model to place a hotspot.");
  });
</script>
</body>
</html>
