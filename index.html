<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Model Viewer TERMINATE Animation</title>

  <script
    type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #111;
    }

    model-viewer {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #f4f4f4;
      z-index: 1;
    }

    .Hotspot {
      display: block;
      position: relative;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 0;
      background: transparent;
      cursor: pointer;
      transform: translate(-50%, -50%);
      z-index: 999;
      padding: 0;
      overflow: visible;
      transition: opacity 0.75s ease;
    }

    model-viewer.guideDimmingHotspots .Hotspot {
      opacity: 0.2;
    }

    .HotspotAnnotation {
      position: absolute;
      left: 50%;
      bottom: 48px;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.5);
      color: white;
      padding: 7px 10px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: bold;
      white-space: nowrap;
      pointer-events: none;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.28);
    }

    .hotspotLottie {
      width: 100%;
      height: 100%;
      transform-origin: 50% 50%;
      will-change: transform;
      pointer-events: none;
    }

    .hotspotLottie.isBack {
      transform: rotate(180deg);
    }

    .hotspotLottie.flipToBack {
      animation: flipToBack 0.72s cubic-bezier(0.2, 0.9, 0.25, 1.15) forwards;
    }

    .hotspotLottie.flipToTerminate {
      animation: flipToTerminate 0.72s cubic-bezier(0.2, 0.9, 0.25, 1.15) forwards;
    }

    .InfoHotspot {
      display: block;
      position: relative;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 0;
      background: transparent;
      cursor: pointer;
      transform: translate(-50%, -50%);
      padding: 0;
      z-index: 999;
      overflow: visible;
    }

    .infoHotspotLottie {
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .hiddenUntilTerminate {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    .hiddenUntilTerminate.isVisible {
      opacity: 1;
      pointer-events: auto;
    }

    .hiddenUntilOsEndEnd {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    .hiddenUntilOsEndEnd.isVisible {
      opacity: 1;
      pointer-events: auto;
    }

    .hiddenUntilIsStartStart {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    .hiddenUntilIsStartStart.isVisible {
      opacity: 1;
      pointer-events: auto;
    }

    .hiddenUntilBoxBase {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    .hiddenUntilBoxBase.isVisible {
      opacity: 1;
      pointer-events: auto;
    }

    .hiddenUntilOsStartStart {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    .hiddenUntilOsStartStart.isVisible {
      opacity: 1;
      pointer-events: auto;
    }

    .hiddenUntilIsEndStart {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    .hiddenUntilIsEndStart.isVisible {
      opacity: 1;
      pointer-events: auto;
    }

    .hiddenUntilIsEndEnd {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    .hiddenUntilIsEndEnd.isVisible {
      opacity: 1;
      pointer-events: auto;
    }

    .hiddenUntilOsStartEnd {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    .hiddenUntilOsStartEnd.isVisible {
      opacity: 1;
      pointer-events: auto;
    }

    .hiddenUntilStarter {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    .hiddenUntilStarter.isVisible {
      opacity: 1;
      pointer-events: auto;
    }

    .hiddenVideoHotspot {
      opacity: 0;
      pointer-events: none;
    }

    .hiddenVideoHotspot.isVisible {
      opacity: 1;
      pointer-events: auto;
    }

    .videoHotspotLottie {
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #terminateVideoHotspot,
    #osEndEndVideoHotspot,
    #isStartStartVideoHotspot,
    #boxBaseVideoHotspot,
    #osStartStartVideoHotspot,
    #isEndStartVideoHotspot,
    #isEndEndVideoHotspot,
    #osStartEndVideoHotspot,
    #starterVideoHotspot {
      width: 210px;
      height: 210px;
    }

    .videoOverlay {
      position: fixed;
      inset: 0;
      z-index: 9999999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      box-sizing: border-box;
      background: transparent;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s ease;
    }

    .videoOverlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .videoWindow {
      position: relative;
      width: min(920px, 90vw);
      height: min(560px, 78vh);
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 20px;
      padding: 24px;
      box-sizing: border-box;
      border-radius: 24px;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(9px);
      -webkit-backdrop-filter: blur(9px);
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.22);
      overflow: hidden;
    }

    .videoFrameWrap {
      position: relative;
      min-width: 0;
      min-height: 0;
      border-radius: 20px;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.55);
    }

    #youtubeFrame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }


    @keyframes flipToBack {
      0% {
        transform: rotate(0deg);
      }

      64% {
        transform: rotate(206deg);
      }

      84% {
        transform: rotate(171deg);
      }

      100% {
        transform: rotate(180deg);
      }
    }

    @keyframes flipToTerminate {
      0% {
        transform: rotate(180deg);
      }

      64% {
        transform: rotate(-26deg);
      }

      84% {
        transform: rotate(9deg);
      }

      100% {
        transform: rotate(0deg);
      }
    }

    .hotspotSummaryWindow {
      position: fixed;
      top: 24px;
      left: 24px;
      z-index: 9999996;
      width: min(360px, calc(100vw - 48px));
      padding: 22px 22px 20px;
      border-radius: 22px;
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      box-sizing: border-box;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.28);
      opacity: 0;
      transform: translateY(-10px);
      pointer-events: none;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .hotspotSummaryWindow.open {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .hotspotSummaryWindow.open.isHiddenBehindInfo {
      opacity: 0;
      pointer-events: none;
    }

    .hotspotSummaryCloseButton {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 24px;
      height: 24px;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      font-size: 18px;
      line-height: 24px;
      padding: 0;
      cursor: pointer;
    }

    .hotspotSummaryTitle {
      padding-right: 28px;
      font-size: 18px;
      line-height: 1.12;
      font-weight: 800;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .hotspotSummaryBody {
      font-size: 13px;
      line-height: 1.45;
      font-weight: 400;
      opacity: 0.94;
      margin-bottom: 0;
    }

    .hotspotSummaryVideoButton {
      display: block;
      width: 192px;
      height: 192px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      padding: 0;
      margin: -54px 0 -78px -18px;
      cursor: pointer;
    }

    .hotspotSummaryVideoLottie {
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .bottomControlBar {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 999999;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 32px 10px 32px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.5);
      box-sizing: border-box;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      opacity: 1;
      pointer-events: auto;
      transition: opacity 0.28s ease;
    }

    .bottomControlBar.isWindowOpen {
      opacity: 0;
      pointer-events: none;
    }

    .bottomControlButton {
      position: relative;
      width: 23px;
      height: 23px;
      border: 0;
      border-radius: 0;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2px;
      box-sizing: border-box;
      transition: transform 0.18s ease, opacity 0.18s ease;
    }

    .bottomControlButton:hover {
      transform: translateY(-2px);
      opacity: 0.85;
    }

    .bottomControlButton:active {
      transform: translateY(0) scale(0.96);
    }

    .bottomControlButton img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
    }

    .bottomControlTooltip {
      position: absolute;
      left: 50%;
      bottom: calc(100% + 13px);
      transform: translateX(-50%) translateY(6px);
      padding: 6px 9px;
      border-radius: 7px;
      background: rgba(0, 0, 0, 0.66);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.22s ease, transform 0.22s ease;
      transition-delay: 0s;
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.22);
    }

    .bottomControlButton:hover .bottomControlTooltip,
    .bottomControlButton:focus-visible .bottomControlTooltip {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      transition-delay: 1s;
    }

    .bottomControlButton:not(:hover):not(:focus-visible) .bottomControlTooltip {
      transition-delay: 0s;
    }

    #resetCameraButton {
      width: 29px;
      height: 29px;
      padding: 2px;
    }

    .howToOverlay {
      position: fixed;
      inset: 0;
      z-index: 9999998;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.28s ease;
    }

    .howToOverlay.open {
      opacity: 1;
    }

    .customGuideIconWrap {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(124px, 20vw);
      height: min(124px, 20vw);
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      filter: drop-shadow(0 16px 26px rgba(0, 0, 0, 0.35));
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .howToOverlay.open .customGuideIconWrap {
      opacity: 1;
    }

    .customGuideIcon {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      user-select: none;
      pointer-events: none;
    }

    .customGuideIcon.isHidden {
      opacity: 0 !important;
      animation: none !important;
    }

    .customGuideIcon.guidePan {
      animation: guidePanMotion 4.2s ease-in-out both;
    }

    .customGuideIcon.guideRotate {
      animation: guideRotateMotion 4.2s ease-in-out both;
    }

    .customGuideIcon.guideScroll {
      animation: guideScrollMotion 4.2s ease-in-out both;
    }

    .mouseInfoMini {
      position: fixed;
      right: 24px;
      bottom: 104px;
      width: min(300px, 40vw);
      padding: 16px;
      box-sizing: border-box;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.22);
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .mouseInfoMini.isVisible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .mouseInfoMini img {
      width: 100%;
      height: auto;
      display: block;
      user-select: none;
      pointer-events: none;
      filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.18));
    }

    .bottomControlButton.isUnsupported {
      display: none;
    }

    model-viewer::part(default-ar-button) {
      display: none;
    }

    .mouseInfoCloseButton {
      position: absolute;
      right: -8px;
      top: -10px;
      width: 22px;
      height: 22px;
      border: 0;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.68);
      color: #fff;
      line-height: 22px;
      font-size: 16px;
      cursor: pointer;
      padding: 0;
      z-index: 2;
    }

    @keyframes guidePanMotion {
      0% { transform: translateX(0) scale(0.96); opacity: 0; }
      12% { opacity: 1; }
      28% { transform: translateX(56px) scale(1); }
      55% { transform: translateX(-56px) scale(1); }
      82% { transform: translateX(34px) scale(1); opacity: 1; }
      100% { transform: translateX(0) scale(0.96); opacity: 0; }
    }

    @keyframes guideRotateMotion {
      0% { transform: translateX(0) rotate(0deg) scale(0.96); opacity: 0; }
      12% { opacity: 1; }
      28% { transform: translateX(-58px) rotate(-7deg) scale(1); }
      55% { transform: translateX(58px) rotate(7deg) scale(1); }
      82% { transform: translateX(-34px) rotate(-4deg) scale(1); opacity: 1; }
      100% { transform: translateX(0) rotate(0deg) scale(0.96); opacity: 0; }
    }

    @keyframes guideScrollMotion {
      0% { transform: translateY(0) scale(0.96); opacity: 0; }
      12% { opacity: 1; }
      28% { transform: translateY(-34px) scale(1.04); }
      52% { transform: translateY(34px) scale(0.96); }
      76% { transform: translateY(-18px) scale(1.02); opacity: 1; }
      100% { transform: translateY(0) scale(0.96); opacity: 0; }
    }

    @media (max-width: 720px) {
      .hotspotSummaryWindow {
        top: 14px;
        left: 14px;
        width: min(330px, calc(100vw - 28px));
        padding: 18px 18px 16px;
        border-radius: 18px;
      }

      .hotspotSummaryTitle {
        font-size: 16px;
      }

      .hotspotSummaryBody {
        font-size: 12px;
      }

      .hotspotSummaryVideoButton {
        width: 157px;
        height: 157px;
        margin: -44px 0 -64px -14px;
      }

      .bottomControlBar {
        right: 14px;
        bottom: 14px;
        gap: 6px;
        padding: 8px 24px 8px 24px;
      }

      .bottomControlButton {
        width: 20px;
        height: 20px;
        padding: 2px;
      }

      #resetCameraButton {
        width: 25px;
        height: 25px;
        padding: 2px;
      }

      .customGuideIconWrap {
        width: min(100px, 26vw);
        height: min(100px, 26vw);
      }

      .mouseInfoMini {
        right: 14px;
        bottom: 84px;
        width: min(230px, 50vw);
        padding: 12px;
        border-radius: 18px;
      }
    }

    .progress-bar {
      display: block;
      width: 33%;
      height: 10%;
      max-height: 2%;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate3d(-50%, -50%, 0);
      border-radius: 25px;
      box-shadow:
        0 3px 10px 3px rgba(0, 0, 0, 0.5),
        0 0 5px 1px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.9);
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 10;
    }

    .progress-bar.hide {
      visibility: hidden;
      transition: visibility 0.3s;
    }

    .update-bar {
      background-color: rgba(255, 255, 255, 0.9);
      width: 0%;
      height: 100%;
      border-radius: 25px;
      float: left;
      transition: width 0.3s;
    }

    .infoOverlay {
      position: fixed;
      inset: 0;
      z-index: 9999999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      box-sizing: border-box;
      background: transparent;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s ease;
    }

    .infoOverlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .infoWindow {
      position: relative;
      width: min(920px, 90vw);
      height: min(560px, 78vh);
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto 1fr;
      gap: 20px;
      padding: 24px;
      box-sizing: border-box;
      border-radius: 24px;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(9px);
      -webkit-backdrop-filter: blur(9px);
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.22);
      overflow: hidden;
    }

    .infoHeader {
      grid-column: 1 / -1;
      padding: 0 48px 0 4px;
      color: white;
      line-height: 1.15;
      pointer-events: none;
    }

    .infoTitle {
      font-size: clamp(20px, 2.6vw, 30px);
      font-weight: 800;
      letter-spacing: 0.01em;
    }

    .infoSubtitle {
      margin-top: 5px;
      font-size: clamp(12px, 1.35vw, 16px);
      font-weight: 300;
      letter-spacing: 0.025em;
      opacity: 0.88;
          white-space: pre-line;
}

    .infoCloseButton {
      position: absolute;
      right: 16px;
      top: 16px;
      z-index: 5;
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.65);
      color: black;
      font-size: 23px;
      line-height: 32px;
      font-weight: 400;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .infoCloseButton:hover {
      background: rgba(255, 255, 255, 0.9);
    }

    .sequencePanel,
    .lottiePanel {
      position: relative;
      min-width: 0;
      min-height: 0;
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lottiePanel {
      order: 1;
      background: rgba(255, 255, 255, 0.8);
    }

    .sequencePanel {
      order: 2;
      background: transparent;
      cursor: grab;
      user-select: none;
      touch-action: none;
    }

    .sequencePanel.dragging {
      cursor: grabbing;
    }

    #sequenceImage {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
      opacity: 1;
      transition: opacity 0.75s ease;
    }

    #sequenceImage.sequenceHidden {
      opacity: 0;
    }

    .touchGuide {
      position: absolute;
      left: 50%;
      top: 50%;
      width: clamp(49px, 7.65vw, 82px);
      height: auto;
      transform: translate3d(-50%, -50%, 0);
      opacity: 0;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
      filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.35));
      will-change: transform, opacity;
    }

    #infoLottie {
      width: 100%;
      height: 100%;
    }


    @media (max-width: 800px) {
      .infoWindow {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr 1fr;
        height: min(740px, 86vh);
        gap: 14px;
        padding: 20px;
      }

      .sequencePanel,
      .lottiePanel {
        min-height: 0;
      }
    }
  </style>
</head>

<body>

  <model-viewer
    id="viewer"
    src="RP-TRIM GUIDE test 17.glb"
    camera-controls
    tone-mapping="neutral"
    poster="poster.webp"
    shadow-intensity="1"
    exposure="1"

    camera-orbit="-35.62141deg 60.17364deg 6.30660m"
    camera-target="0.41971m 0.32003m -0.01002m"
    field-of-view="15.06401deg"

    min-camera-orbit="-80deg 30deg 0.35m"
    max-camera-orbit="80deg 88deg 7m"
    min-field-of-view="8deg"
    max-field-of-view="60deg"

    interpolation-decay="120"
    animation-crossfade-duration="0"
    interaction-prompt="none"
    disable-tap
  >

    <button
      id="terminateHotspot"
      class="Hotspot"
      slot="hotspot-1"
      data-position="-0.54622m 0.26164m -0.74322m"
      data-normal="0.00000m -0.00000m 1.00000m"
    >
      <div class="hotspotLottie" id="terminateHotspotLottie" aria-hidden="true"></div>
      <div class="HotspotAnnotation" id="hotspotLabel">TERMINATE</div>
    </button>

    <button
      id="osEndEndHotspot"
      class="Hotspot"
      slot="hotspot-os-end-end"
      data-position="-0.04363m 0.31524m -0.02159m"
      data-normal="-1.00000m 0.00000m 0.00000m"
    >
      <div class="hotspotLottie" id="osEndEndHotspotLottie" aria-hidden="true"></div>
      <div class="HotspotAnnotation" id="osEndEndHotspotLabel">OS END END</div>
    </button>

    <button
      id="isStartStartHotspot"
      class="Hotspot"
      slot="hotspot-is-start-start"
      data-position="-0.06267m 0.23102m -0.75201m"
      data-normal="-1.00000m 0.00000m -0.00000m"
    >
      <div class="hotspotLottie" id="isStartStartHotspotLottie" aria-hidden="true"></div>
      <div class="HotspotAnnotation" id="isStartStartHotspotLabel">IS START START</div>
    </button>

    <button
      id="boxBaseHotspot"

    function parseCameraOrbit(orbitValue, allowDefaultFallback = true) {
      const orbit = String(orbitValue || modelViewer.cameraOrbit || "");
      const parts = orbit.trim().split(/\s+/);

      const thetaPart = parts[0] || "";
      const phiPart = parts[1] || "";
      const radiusPart = parts[2] || "";

      const theta = parseFloat(thetaPart);
      const phi = parseFloat(phiPart);
      const radius = parseFloat(radiusPart);

      if (!Number.isFinite(theta) || !Number.isFinite(phi) || !Number.isFinite(radius)) {
        if (allowDefaultFallback) {
          return parseCameraOrbit(DEFAULT_CAMERA_VIEW.orbit, false);
        }

        return null;
      }

      return {
        theta,
        phi,
        radius,
        thetaUnit: thetaPart.replace(String(theta), "") || "deg",
        phiUnit: phiPart.replace(String(phi), "") || "deg",
        radiusUnit: radiusPart.replace(String(radius), "") || "m"
      };
    }

    function readLiveCameraOrbitState() {
      if (typeof modelViewer.getCameraOrbit !== "function") {
        return null;
      }

      const liveOrbit = modelViewer.getCameraOrbit();

      if (
        !liveOrbit ||
        !Number.isFinite(liveOrbit.theta) ||
        !Number.isFinite(liveOrbit.phi) ||
        !Number.isFinite(liveOrbit.radius)
      ) {
        return null;
      }

      return {
        theta: liveOrbit.theta * RAD_TO_DEG,
        phi: liveOrbit.phi * RAD_TO_DEG,
        radius: liveOrbit.radius,
        thetaUnit: "deg",
        phiUnit: "deg",
        radiusUnit: "m"
      };
    }

    function getClampedCameraOrbit(nextOrbit = modelViewer.cameraOrbit) {
      const parsed = parseCameraOrbit(nextOrbit);
      if (!parsed) return null;

      return {
        theta: Math.max(CAMERA_MIN_THETA, Math.min(CAMERA_MAX_THETA, parsed.theta)),
        phi: Math.max(CAMERA_MIN_PHI, Math.min(CAMERA_MAX_PHI, parsed.phi)),
        radius: Math.max(CAMERA_MIN_RADIUS, Math.min(CAMERA_MAX_RADIUS, parsed.radius)),
        thetaUnit: parsed.thetaUnit,
        phiUnit: parsed.phiUnit,
        radiusUnit: parsed.radiusUnit
      };
    }

    function applyCameraOrbit(orbit) {
      if (!orbit) return;

      lastGoodCameraOrbitState = {
        theta: orbit.theta,
        phi: orbit.phi,
        radius: orbit.radius,
        thetaUnit: orbit.thetaUnit || "deg",
        phiUnit: orbit.phiUnit || "deg",
        radiusUnit: orbit.radiusUnit || "m"
      };

      modelViewer.setAttribute("interpolation-decay", "120");
      modelViewer.cameraOrbit = `${orbit.theta.toFixed(5)}${orbit.thetaUnit} ${orbit.phi.toFixed(5)}${orbit.phiUnit} ${orbit.radius.toFixed(5)}${orbit.radiusUnit}`;
    }

    function clampCameraOrbit() {
      const parsed = readLiveCameraOrbitState() || parseCameraOrbit(modelViewer.cameraOrbit, false);
      if (!parsed) return;

      const clamped = {
        theta: Math.max(CAMERA_MIN_THETA, Math.min(CAMERA_MAX_THETA, parsed.theta)),
        phi: Math.max(CAMERA_MIN_PHI, Math.min(CAMERA_MAX_PHI, parsed.phi)),
        radius: Math.max(CAMERA_MIN_RADIUS, Math.min(CAMERA_MAX_RADIUS, parsed.radius)),
        thetaUnit: "deg",
        phiUnit: "deg",
        radiusUnit: "m"
      };

      const changed =
        Math.abs(parsed.theta - clamped.theta) > 0.001 ||
        Math.abs(parsed.phi - clamped.phi) > 0.001 ||
        Math.abs(parsed.radius - clamped.radius) > 0.001;

      if (changed) {
        applyCameraOrbit(clamped);
      } else {
        lastGoodCameraOrbitState = clamped;
      }
    }

    function hardClampCameraRadius() {
      const parsed = readLiveCameraOrbitState() || parseCameraOrbit(modelViewer.cameraOrbit, false);
      if (!parsed) return;

      if (parsed.radius > CAMERA_MAX_RADIUS || parsed.radius < CAMERA_MIN_RADIUS) {
        applyCameraOrbit({
          theta: Math.max(CAMERA_MIN_THETA, Math.min(CAMERA_MAX_THETA, parsed.theta)),
          phi: Math.max(CAMERA_MIN_PHI, Math.min(CAMERA_MAX_PHI, parsed.phi)),
          radius: Math.max(CAMERA_MIN_RADIUS, Math.min(CAMERA_MAX_RADIUS, parsed.radius)),
          thetaUnit: "deg",
          phiUnit: "deg",
          radiusUnit: "m"
        });
      }
    }

    function clampCameraAfterWheel() {
      requestAnimationFrame(() => {
        if (!manualZoomInProgress) {
          hardClampCameraRadius();
          clampCameraOrbit();
        }
      });

      setTimeout(() => {
        if (!manualZoomInProgress) {
          hardClampCameraRadius();
          clampCameraOrbit();
        }
      }, 320);
    }

    function restoreBrokenCameraIfNeeded() {
      const parsed = readLiveCameraOrbitState() || parseCameraOrbit(modelViewer.cameraOrbit, false);
      const currentFov = parseFloat(modelViewer.fieldOfView);

      if (!parsed) {
        moveCameraToDefaultView(true);
        return;
      }

      if (parsed.radius > CAMERA_MAX_RADIUS || parsed.radius < CAMERA_MIN_RADIUS) {
        applyCameraOrbit({
          theta: Math.max(CAMERA_MIN_THETA, Math.min(CAMERA_MAX_THETA, parsed.theta)),
          phi: Math.max(CAMERA_MIN_PHI, Math.min(CAMERA_MAX_PHI, parsed.phi)),
          radius: Math.max(CAMERA_MIN_RADIUS, Math.min(CAMERA_MAX_RADIUS, parsed.radius)),
          thetaUnit: "deg",
          phiUnit: "deg",
          radiusUnit: "m"
        });
      }

      if (!Number.isFinite(currentFov) || currentFov > 60 || currentFov < 5) {
        modelViewer.fieldOfView = DEFAULT_CAMERA_VIEW.fov;
      }
    }

    function clampCameraAfterUnexpectedInteraction() {
      restoreBrokenCameraIfNeeded();

      requestAnimationFrame(restoreBrokenCameraIfNeeded);

      setTimeout(restoreBrokenCameraIfNeeded, 80);
      setTimeout(restoreBrokenCameraIfNeeded, 220);
    }

    function beginManualZoom() {
      manualZoomInProgress = true;

      if (manualZoomReleaseTimer) {
        clearTimeout(manualZoomReleaseTimer);
      }

      manualZoomReleaseTimer = setTimeout(() => {
        manualZoomInProgress = false;
        manualZoomReleaseTimer = null;
      }, 260);
    }

    function getReliableZoomOrbitState() {
      const liveOrbit = readLiveCameraOrbitState();

      if (
        liveOrbit &&
        liveOrbit.radius <= CAMERA_MAX_RADIUS + 0.25 &&
        liveOrbit.radius >= CAMERA_MIN_RADIUS - 0.05
      ) {
        return liveOrbit;
      }

      const parsed = parseCameraOrbit(modelViewer.cameraOrbit, false);

      if (parsed && parsed.radius <= CAMERA_MAX_RADIUS + 0.25 && parsed.radius >= CAMERA_MIN_RADIUS - 0.05) {
        return parsed;
      }

      return lastGoodCameraOrbitState;
    }

    function setCameraRadius(nextRadius) {
      const parsed = getReliableZoomOrbitState();
      if (!parsed) return;

      const radius = Math.max(CAMERA_MIN_RADIUS, Math.min(CAMERA_MAX_RADIUS, nextRadius));
      beginManualZoom();

      applyCameraOrbit({
        theta: Math.max(CAMERA_MIN_THETA, Math.min(CAMERA_MAX_THETA, parsed.theta)),
        phi: Math.max(CAMERA_MIN_PHI, Math.min(CAMERA_MAX_PHI, parsed.phi)),
        radius,
        thetaUnit: parsed.thetaUnit || "deg",
        phiUnit: parsed.phiUnit || "deg",
        radiusUnit: parsed.radiusUnit || "m"
      });

      // Keep wheel/button zoom as distance zoom, never FOV zoom, even after a boundary hit.
      if (!Number.isFinite(parseFloat(modelViewer.fieldOfView))) {
        modelViewer.fieldOfView = DEFAULT_CAMERA_VIEW.fov;
      }
    }

    function zoomCamera(direction, factor = CAMERA_ZOOM_FACTOR) {
      const parsed = getReliableZoomOrbitState();
      if (!parsed) return;

      const currentRadius = Math.max(CAMERA_MIN_RADIUS, Math.min(CAMERA_MAX_RADIUS, parsed.radius));
      let nextRadius = direction === "in"
        ? currentRadius * factor
        : currentRadius / factor;

      if (direction === "in" && currentRadius >= CAMERA_MAX_RADIUS - 0.01) {
        nextRadius = CAMERA_MAX_RADIUS * factor;
      }

      setCameraRadius(nextRadius);
    }

    function zoomCameraWithWheel(deltaY) {
      const parsed = getReliableZoomOrbitState();
      if (!parsed) return;

      const currentRadius = Math.max(CAMERA_MIN_RADIUS, Math.min(CAMERA_MAX_RADIUS, parsed.radius));
      const wheelStrength = Math.min(8, Math.max(0.8, Math.abs(deltaY) / 55));
      const wheelFactor = Math.pow(CAMERA_WHEEL_ZOOM_FACTOR, wheelStrength);
      const unclampedRadius = deltaY < 0
        ? currentRadius / wheelFactor
        : currentRadius * wheelFactor;

      let nextRadius = Math.max(CAMERA_MIN_RADIUS, Math.min(CAMERA_MAX_RADIUS, unclampedRadius));

      if (deltaY < 0 && currentRadius >= CAMERA_MAX_RADIUS - 0.01) {
        nextRadius = CAMERA_MAX_RADIUS / wheelFactor;
      }

      setCameraRadius(nextRadius);
    }

    function formatHotspotSummaryTitle(title) {
      if (title.startsWith("IS ")) {
        return `INSIDE ${title.slice(3)}`;
      }

      if (title.startsWith("OS ")) {
        return `OUTSIDE ${title.slice(3)}`;
      }

      return title;
    }

    function ensureHotspotSummaryVideoLottie() {
      if (hotspotSummaryVideoLottieAnimation) return;

      hotspotSummaryVideoLottieAnimation = lottie.loadAnimation({
        container: hotspotSummaryVideoLottie,

      });

      hotspotSummaryVideoLottieAnimation.addEventListener("complete", () => {

    function openHotspotSummaryWindow(summaryKey) {

    function temporarilyHideHotspotSummaryForInfo() {

    function updateModalControlsVisibility() {
      const anyWindowOpen =
        infoOverlay.classList.contains("open") ||
        videoOverlay.classList.contains("open");

      bottomControlBar.classList.toggle("isWindowOpen", anyWindowOpen);

    function getCurrentCameraViewSnapshot() {
      return {
        orbit: modelViewer.cameraOrbit,
        target: modelViewer.cameraTarget,
        fov: modelViewer.fieldOfView
      };
    }

    function clearCustomGuideTimers() {
      customGuideTimers.forEach((timer) => clearTimeout(timer));
      customGuideTimers = [];

      if (customGuideCameraFrameId) {
        cancelAnimationFrame(customGuideCameraFrameId);
        customGuideCameraFrameId = null;
      }

      if (customGuideStartTimer) {
        clearTimeout(customGuideStartTimer);
        customGuideStartTimer = null;
      }
    }

    function clearCustomGuideReplayTimer() {
      if (customGuideReplayTimer) {
        clearTimeout(customGuideReplayTimer);
        customGuideReplayTimer = null;
      }
    }

    function scheduleCustomGuideStep(callback, delay) {
      const timer = setTimeout(callback, delay);
      customGuideTimers.push(timer);
      return timer;
    }

    function isTouchDevice() {
      return Boolean(
        window.matchMedia("(pointer: coarse)").matches ||
        window.matchMedia("(hover: none)").matches ||
        navigator.maxTouchPoints > 0
      );
    }

    function getGuideInfoImage() {
      return document.querySelector("#guideInfoImage");
    }

    function setCustomGuideIcon(src, className) {
      customGuideIcon.classList.remove("guidePan", "guideRotate", "guideScroll", "isHidden");
      customGuideIcon.src = src;

      void customGuideIcon.offsetWidth;
      customGuideIcon.classList.add(className);
    }

    function setGuideCameraView(orbit, target = DEFAULT_CAMERA_VIEW.target, fov = DEFAULT_CAMERA_VIEW.fov) {
      modelViewer.setAttribute("interpolation-decay", "0");
      modelViewer.cameraOrbit = orbit;
      modelViewer.cameraTarget = target;
      modelViewer.fieldOfView = fov;
    }

    function setMouseInfoVisible(isVisible) {
      const guideInfoImage = getGuideInfoImage();

      if (guideInfoImage) {
        const touchMode = isTouchDevice();
        guideInfoImage.src = touchMode ? "touch info.png" : "mouse info.png";
        guideInfoImage.alt = touchMode ? "Touch controls" : "Mouse controls";
      }

      mouseInfoMini.classList.toggle("isVisible", isVisible);
      mouseInfoMini.setAttribute("aria-hidden", isVisible ? "false" : "true");
    }

    function easeInOutSine(progress) {
      return -(Math.cos(Math.PI * progress) - 1) / 2;
    }

    function parseMetersVector(vectorString) {
      return String(vectorString)
        .trim()
        .split(/\s+/)
        .map((part) => parseFloat(part));
    }

    function formatMetersVector(values) {
      return `${values[0].toFixed(5)}m ${values[1].toFixed(5)}m ${values[2].toFixed(5)}m`;
    }

    function lerpNumber(start, end, progress) {
      return start + (end - start) * progress;
    }

    function lerpMetersVector(startString, endString, progress) {
      const start = parseMetersVector(startString);
      const end = parseMetersVector(endString);

      return formatMetersVector([
        lerpNumber(start[0], end[0], progress),
        lerpNumber(start[1], end[1], progress),
        lerpNumber(start[2], end[2], progress)
      ]);
    }

    function formatOrbit(theta, phi, radius) {
      return `${theta.toFixed(5)}deg ${phi.toFixed(5)}deg ${radius.toFixed(5)}m`;
    }

    function animateGuideCamera(keyframes, duration = GUIDE_STEP_DURATION) {
      if (customGuideCameraFrameId) {
        cancelAnimationFrame(customGuideCameraFrameId);
        customGuideCameraFrameId = null;
      }

      const startTime = performance.now();

      function applyFrame(now) {
        if (!customGuideActive) {
          customGuideCameraFrameId = null;
          return;
        }

        const rawProgress = Math.min(1, (now - startTime) / duration);
        const progress = easeInOutSine(rawProgress);
        const segmentSize = 1 / (keyframes.length - 1);
        const segmentIndex = Math.min(keyframes.length - 2, Math.floor(progress / segmentSize));
        const segmentStartProgress = segmentIndex * segmentSize;
        const localProgress = easeInOutSine((progress - segmentStartProgress) / segmentSize);

        const from = keyframes[segmentIndex];
        const to = keyframes[segmentIndex + 1];

        const theta = lerpNumber(from.theta, to.theta, localProgress);
        const phi = lerpNumber(from.phi, to.phi, localProgress);
        const radius = lerpNumber(from.radius, to.radius, localProgress);
        const target = lerpMetersVector(from.target, to.target, localProgress);
        const fov = `${lerpNumber(from.fov, to.fov, localProgress).toFixed(5)}deg`;

        setGuideCameraView(formatOrbit(theta, phi, radius), target, fov);

        if (rawProgress < 1) {
          customGuideCameraFrameId = requestAnimationFrame(applyFrame);
        } else {
          customGuideCameraFrameId = null;
        }
      }

      customGuideCameraFrameId = requestAnimationFrame(applyFrame);
    }

    function showCustomGuideStep(type) {
      if (!customGuideActive) return;

      if (type === "pan") {
        setCustomGuideIcon("mouse right.png", "guidePan");

        // These target offsets move along the camera's screen-right vector, so the model appears
        // to pan horizontally across the viewport instead of diagonally in world space.
        animateGuideCamera([
          { theta: -35.62141, phi: 60.17364, radius: 6.30660, target: DEFAULT_CAMERA_VIEW.target, fov: 15.06401 },
          { theta: -35.62141, phi: 60.17364, radius: 6.30660, target: "0.27200m 0.32003m -0.11300m", fov: 15.06401 },
          { theta: -35.62141, phi: 60.17364, radius: 6.30660, target: "0.56800m 0.32003m 0.09200m", fov: 15.06401 },
          { theta: -35.62141, phi: 60.17364, radius: 6.30660, target: DEFAULT_CAMERA_VIEW.target, fov: 15.06401 }
        ]);
      }

      if (type === "rotate") {
        setCustomGuideIcon("mouse left.png", "guideRotate");

        animateGuideCamera([
          { theta: -35.62141, phi: 60.17364, radius: 6.30660, target: DEFAULT_CAMERA_VIEW.target, fov: 15.06401 },
          { theta: -48.00000, phi: 60.17364, radius: 6.30660, target: DEFAULT_CAMERA_VIEW.target, fov: 15.06401 },
          { theta: -23.00000, phi: 60.17364, radius: 6.30660, target: DEFAULT_CAMERA_VIEW.target, fov: 15.06401 },
          { theta: -35.62141, phi: 60.17364, radius: 6.30660, target: DEFAULT_CAMERA_VIEW.target, fov: 15.06401 }
        ]);
      }

      if (type === "touchRotate") {
        setCustomGuideIcon("touch.png", "guideRotate");

        animateGuideCamera([
          { theta: -35.62141, phi: 60.17364, radius: 6.30660, target: DEFAULT_CAMERA_VIEW.target, fov: 15.06401 },
          { theta: -48.00000, phi: 60.17364, radius: 6.30660, target: DEFAULT_CAMERA_VIEW.target, fov: 15.06401 },
          { theta: -23.00000, phi: 60.17364, radius: 6.30660, target: DEFAULT_CAMERA_VIEW.target, fov: 15.06401 },
          { theta: -35.62141, phi: 60.17364, radius: 6.30660, target: DEFAULT_CAMERA_VIEW.target, fov: 15.06401 }
        ]);
      }

      if (type === "scroll") {
        setCustomGuideIcon("mouse scroll.png", "guideScroll");

        animateGuideCamera([
          { theta: -35.62141, phi: 60.17364, radius: 6.30660, target: DEFAULT_CAMERA_VIEW.target, fov: 15.06401 },
          { theta: -35.62141, phi: 60.17364, radius: 5.45000, target: DEFAULT_CAMERA_VIEW.target, fov: 15.06401 },
          { theta: -35.62141, phi: 60.17364, radius: 6.85000, target: DEFAULT_CAMERA_VIEW.target, fov: 15.06401 },
          { theta: -35.62141, phi: 60.17364, radius: 6.30660, target: DEFAULT_CAMERA_VIEW.target, fov: 15.06401 }
        ]);
      }
    }

    function canAutoReplayGuide() {
      return !customGuideStoppedByUser &&
        !activeMainHotspot &&
        !infoOverlay.classList.contains("open") &&
        !videoOverlay.classList.contains("open");
    }

    function finishCustomGuideCycle() {
      const wasInvokedByHowTo = customGuideInvokedByHowTo;
      const cameraViewToRestore = customGuideReturnCameraView;

      clearCustomGuideTimers();
      customGuideActive = false;
      customGuideIcon.classList.remove("guidePan", "guideRotate", "guideScroll");
      customGuideIcon.classList.add("isHidden");

      if (wasInvokedByHowTo && !customGuideStoppedByUser) {
        // Keep the overlay and mouse info card visible while the guide loops, so there is no flicker.
        // Do not restore to the camera position that was active before the guide started; otherwise
        // a hotspot view can flash back in between guide loops.
        moveCameraToDefaultView(true);
        modelViewer.classList.add("guideDimmingHotspots");
        howToOverlay.classList.add("open");
        howToOverlay.setAttribute("aria-hidden", "false");
        setMouseInfoVisible(true);

        customGuideReplayTimer = setTimeout(() => {
          if (!customGuideStoppedByUser) {
            startCustomGuide({ showMouseInfo: true, auto: false, preserveReturnView: true });
          }
        }, 700);
        return;
      }

      if (cameraViewToRestore) {
        moveCameraToView(cameraViewToRestore, true);
      }

      customGuideReturnCameraView = null;
      customGuideInvokedByHowTo = false;
      howToOverlay.classList.remove("open");
      howToOverlay.setAttribute("aria-hidden", "true");
      setMouseInfoVisible(false);
      modelViewer.classList.remove("guideDimmingHotspots");

      if (canAutoReplayGuide()) {
        customGuideReplayTimer = setTimeout(() => {
          if (canAutoReplayGuide()) {
            startCustomGuide({ showMouseInfo: false, auto: true, preserveReturnView: true });
          }
        }, GUIDE_AUTO_REPLAY_DELAY);
      }
    }

    function startCustomGuide(options = {}) {
      const { showMouseInfo = false, auto = false, preserveReturnView = false, returnCameraView = null } = options;

      if (auto && activeMainHotspot) return;
      if (auto && (infoOverlay.classList.contains("open") || videoOverlay.classList.contains("open"))) return;

      clearCustomGuideReplayTimer();

      if (customGuideActive) {
        stopCustomGuide(false, false);
      } else {
        clearCustomGuideTimers();
      }

      customGuideActive = true;
      customGuideIcon.classList.remove("isHidden");
      customGuideInvokedByHowTo = !auto;
      customGuideHasPlayedAutomatically = customGuideHasPlayedAutomatically || auto;
      customGuideReturnCameraView = returnCameraView
        ? returnCameraView
        : preserveReturnView && customGuideReturnCameraView
          ? customGuideReturnCameraView
          : getCurrentCameraViewSnapshot();

      closeInfoWindow();
      closeVideoWindow();

      modelViewer.classList.add("guideDimmingHotspots");
      howToOverlay.classList.add("open");
      howToOverlay.setAttribute("aria-hidden", "false");
      setMouseInfoVisible(showMouseInfo);

      if (isTouchDevice()) {
        showCustomGuideStep("touchRotate");
        scheduleCustomGuideStep(finishCustomGuideCycle, GUIDE_STEP_DURATION + 250);
        return;
      }

      showCustomGuideStep("pan");
      scheduleCustomGuideStep(() => showCustomGuideStep("rotate"), GUIDE_STEP_DURATION + GUIDE_STEP_GAP);
      scheduleCustomGuideStep(() => showCustomGuideStep("scroll"), (GUIDE_STEP_DURATION + GUIDE_STEP_GAP) * 2);
      scheduleCustomGuideStep(finishCustomGuideCycle, (GUIDE_STEP_DURATION + GUIDE_STEP_GAP) * 3 + 250);
    }

    function stopCustomGuide(restoreCamera = true, markAsUserStopped = true) {
      const cameraViewToRestore = customGuideReturnCameraView;

      clearCustomGuideTimers();
      clearCustomGuideReplayTimer();

      if (markAsUserStopped) {
        customGuideStoppedByUser = true;
      }

      customGuideActive = false;
      customGuideInvokedByHowTo = false;
      customGuideReturnCameraView = null;

      customGuideIcon.classList.remove("guidePan", "guideRotate", "guideScroll");
      customGuideIcon.classList.add("isHidden");
      howToOverlay.classList.remove("open");
      howToOverlay.setAttribute("aria-hidden", "true");
      setMouseInfoVisible(false);
      modelViewer.classList.remove("guideDimmingHotspots");

      if (restoreCamera && cameraViewToRestore) {
        moveCameraToView(cameraViewToRestore, true);
      }
    }

    function getActiveHotspotReverseDelay() {
      const activeSafeEndTime =
        activeMainHotspot === "osEndEnd" ? osEndEndSafeEndTime :
        activeMainHotspot === "isStartStart" ? isStartStartSafeEndTime :
        activeMainHotspot === "boxBase" ? boxBaseSafeEndTime :
        activeMainHotspot === "osStartStart" ? osStartStartSafeEndTime :
        activeMainHotspot === "isEndStart" ? isEndStartSafeEndTime :
        activeMainHotspot === "isEndEnd" ? isEndEndSafeEndTime :
        activeMainHotspot === "osStartEnd" ? osStartEndSafeEndTime :
        activeMainHotspot === "starter" ? starterSafeEndTime :
        activeMainHotspot === "terminate" ? safeEndTime :
        0;

      return Math.max(900, (activeSafeEndTime / REVERSE_SPEED) * 1000 + 250);
    }

    function closeActiveHotspotForGuide() {
      if (isPlaying) return 0;

      if (activeMainHotspot === "terminate" && isOpen) {
        playBackwardByScrubbing();
        return getActiveHotspotReverseDelay();
      }

      if (activeMainHotspot === "osEndEnd" && isOsEndEndOpen) {
        playOsEndEndBackwardByScrubbing();
        return getActiveHotspotReverseDelay();
      }

      if (activeMainHotspot === "isStartStart" && isIsStartStartOpen) {
        playIsStartStartBackwardByScrubbing();
        return getActiveHotspotReverseDelay();
      }

      if (activeMainHotspot === "boxBase" && isBoxBaseOpen) {
        playBoxBaseBackwardByScrubbing();
        return getActiveHotspotReverseDelay();
      }

      if (activeMainHotspot === "osStartStart" && isOsStartStartOpen) {
        playOsStartStartBackwardByScrubbing();
        return getActiveHotspotReverseDelay();
      }

      if (activeMainHotspot === "isEndStart" && isIsEndStartOpen) {
        playIsEndStartBackwardByScrubbing();
        return getActiveHotspotReverseDelay();
      }

      if (activeMainHotspot === "isEndEnd" && isIsEndEndOpen) {
        playIsEndEndBackwardByScrubbing();
        return getActiveHotspotReverseDelay();
      }

      if (activeMainHotspot === "osStartEnd" && isOsStartEndOpen) {
        playOsStartEndBackwardByScrubbing();
        return getActiveHotspotReverseDelay();
      }

      if (activeMainHotspot === "starter" && isStarterOpen) {
        playStarterBackwardByScrubbing();
        return getActiveHotspotReverseDelay();
      }

      return 0;
    }

    function openHowToWindow() {
      const returnCameraView = getCurrentCameraViewSnapshot();

      customGuideStoppedByUser = false;
      clearCustomGuideReplayTimer();
      clearCustomGuideTimers();

      customGuideInvokedByHowTo = true;
      customGuideReturnCameraView = returnCameraView;

      closeInfoWindow();
      closeVideoWindow();

      const reverseDelay = closeActiveHotspotForGuide();

      modelViewer.classList.add("guideDimmingHotspots");
      howToOverlay.classList.add("open");
      howToOverlay.setAttribute("aria-hidden", "false");
      customGuideIcon.classList.add("isHidden");
      setMouseInfoVisible(true);

      if (!reverseDelay) {
        moveCameraToDefaultView(true);
      }

      customGuideStartTimer = setTimeout(() => {
        customGuideStartTimer = null;

        if (!customGuideStoppedByUser) {
          startCustomGuide({
            showMouseInfo: true,
            auto: false,
            preserveReturnView: true,
            returnCameraView
          });
        }
      }, reverseDelay || GUIDE_PRE_START_CAMERA_DELAY);
    }

    function closeHowToWindow() {
      stopCustomGuide(true, true);
    }

    function isFullscreenSupported() {
      const fullscreenTarget = document.documentElement;

      return Boolean(
        fullscreenTarget.requestFullscreen ||
        fullscreenTarget.webkitRequestFullscreen ||
        document.exitFullscreen ||
        document.webkitExitFullscreen
      );
    }

    function updateFullscreenButton() {
      const supported = isFullscreenSupported();

      fullscreenButton.classList.toggle("isUnsupported", !supported);
      fullscreenButton.disabled = !supported;
      fullscreenButton.setAttribute("aria-hidden", supported ? "false" : "true");

      if (!supported) {
        fullscreenButton.setAttribute("aria-label", "Fullscreen unavailable");
        return;
      }

      const isFullscreen = Boolean(document.fullscreenElement || document.webkitFullscreenElement);
      fullscreenButtonIcon.src = isFullscreen ? "EXIT FULLSCREEN.png" : "ENTER FULLSCREEN.png";
      fullscreenButton.setAttribute("aria-label", isFullscreen ? "Exit fullscreen" : "Enter fullscreen");

      const fullscreenTooltip = document.querySelector("#fullscreenTooltip");
      if (fullscreenTooltip) {
        fullscreenTooltip.textContent = isFullscreen ? "Exit fullscreen" : "Fullscreen";
      }
    }

    async function toggleFullscreen() {
      if (!isFullscreenSupported()) {
        updateFullscreenButton();
        return;
      }

      try {
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
          const fullscreenTarget = document.documentElement;

          if (fullscreenTarget.requestFullscreen) {
            await fullscreenTarget.requestFullscreen();
          } else if (fullscreenTarget.webkitRequestFullscreen) {
            fullscreenTarget.webkitRequestFullscreen();
          }
        } else if (document.exitFullscreen) {
          await document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      } catch (error) {
        console.warn("Fullscreen request failed:", error);
      }

      updateFullscreenButton();
    }

    zoomInButton.addEventListener("click", (event) => {
      event.stopPropagation();
      restoreBrokenCameraIfNeeded();
      zoomCamera("in");
      clampCameraAfterWheel();
    });

    zoomOutButton.addEventListener("click", (event) => {
      event.stopPropagation();
      restoreBrokenCameraIfNeeded();
      zoomCamera("out");
      clampCameraAfterWheel();
    });

    resetCameraButton.addEventListener("click", (event) => {
      event.stopPropagation();

      if (customGuideActive || customGuideReplayTimer) {
        stopCustomGuide(false, true);
      }

      closeInfoWindow();
      closeVideoWindow();

      const reverseDelay = closeActiveHotspotForGuide();

      if (!reverseDelay) {
        moveCameraToDefaultView(true);
      }
    });

    let modelViewerPointerStart = null;

    modelViewer.addEventListener("pointerdown", (event) => {
      if (customGuideActive || customGuideReplayTimer) {
        stopCustomGuide(true, true);
      }

      modelViewerPointerStart = {
        x: event.clientX,
        y: event.clientY,
        target: event.target
      };
    }, { capture: true });

    modelViewer.addEventListener("pointerup", (event) => {
      if (!modelViewerPointerStart) return;

      const movedDistance = Math.hypot(
        event.clientX - modelViewerPointerStart.x,
        event.clientY - modelViewerPointerStart.y
      );

    function scrubBackwardFrame(timestamp) {
      if (lastReverseTimestamp === null) {
        lastReverseTimestamp = timestamp;
      }

      const deltaSeconds = (timestamp - lastReverseTimestamp) / 1000;
      lastReverseTimestamp = timestamp;

      const nextTime = modelViewer.currentTime - deltaSeconds * REVERSE_SPEED;

      if (nextTime <= 0) {
        modelViewer.currentTime = 0;
        modelViewer.pause();
        modelViewer.timeScale = 1;

        isPlaying = false;

        if (activeMainHotspot === "osEndEnd") {
          isOsEndEndOpen = false;

        activeMainHotspot = null;

      modelViewer.currentTime = nextTime;
      reverseFrameId = requestAnimationFrame(scrubBackwardFrame);
    }

    function loadHotspotLotties() {
      if (!window.lottie) {
        console.warn("Lottie/bodymovin is not loaded.");
        return;

      if (terminateHotspotLottieAnimation) {
        terminateHotspotLottieAnimation.destroy();
      }

      if (osEndEndHotspotLottieAnimation) {
        osEndEndHotspotLottieAnimation.destroy();
      }

      if (isStartStartHotspotLottieAnimation) {
        isStartStartHotspotLottieAnimation.destroy();
      }

      if (boxBaseHotspotLottieAnimation) {
        boxBaseHotspotLottieAnimation.destroy();
      }

      if (osStartStartHotspotLottieAnimation) {
        osStartStartHotspotLottieAnimation.destroy();
      }

      if (isEndStartHotspotLottieAnimation) {

      }

      if (isEndEndHotspotLottieAnimation) {
        isEndEndHotspotLottieAnimation.destroy();
      }

      if (osStartEndHotspotLottieAnimation) {
        osStartEndHotspotLottieAnimation.destroy();
      }

      if (starterHotspotLottieAnimation) {
        starterHotspotLottieAnimation.destroy();
      }

      videoHotspotLottieAnimations.forEach((animation) => {
        if (animation) animation.destroy();
      });
      videoHotspotLottieAnimations = [];

      infoHotspotLottieAnimations.forEach((animation) => {
        if (animation) animation.destroy();
      });
      infoHotspotLottieAnimations = [];

      function loadMainHotspotPulse(container, staggerIndex) {
        if (!container) return null;

        const animation = lottie.loadAnimation({
          container,
          renderer: "svg",
          loop: true,
          autoplay: false,
          path: TERMINATE_HOTSPOT_LOTTIE_PATH
        });

        animation.addEventListener("DOMLoaded", () => {
          const delay = staggerIndex * MAIN_HOTSPOT_PULSE_STAGGER;

          setTimeout(() => {
            if (animation && typeof animation.goToAndPlay === "function") {
              animation.goToAndPlay(0, true);
            } else if (animation && typeof animation.play === "function") {
              animation.play();
            }
          }, delay);
        });

        return animation;
      }

      terminateHotspotLottieAnimation = loadMainHotspotPulse(terminateHotspotLottie, 0);
      isStartStartHotspotLottieAnimation = loadMainHotspotPulse(isStartStartHotspotLottie, 1);
      osEndEndHotspotLottieAnimation = loadMainHotspotPulse(osEndEndHotspotLottie, 2);
      boxBaseHotspotLottieAnimation = loadMainHotspotPulse(boxBaseHotspotLottie, 3);
      osStartStartHotspotLottieAnimation = loadMainHotspotPulse(osStartStartHotspotLottie, 4);
      isEndStartHotspotLottieAnimation = loadMainHotspotPulse(isEndStartHotspotLottie, 5);
      isEndEndHotspotLottieAnimation = loadMainHotspotPulse(isEndEndHotspotLottie, 6);
      osStartEndHotspotLottieAnimation = loadMainHotspotPulse(osStartEndHotspotLottie, 7);
      starterHotspotLottieAnimation = loadMainHotspotPulse(starterHotspotLottie, 8);

      [terminateVideoHotspotLottie, osEndEndVideoHotspotLottie, isStartStartVideoHotspotLottie, boxBaseVideoHotspotLottie, osStartStartVideoHotspotLottie, isEndStartVideoHotspotLottie, isEndEndVideoHotspotLottie, osStartEndVideoHotspotLottie, starterVideoHotspotLottie].forEach((container) => {
        if (!container) return;

        const animation = lottie.loadAnimation({
          container,
          renderer: "svg",
          loop: false,
          autoplay: false,
          path: VIDEO_HOTSPOT_LOTTIE_PATH
        });

        animation.addEventListener("DOMLoaded", () => {
          animation.goToAndStop(0, true);
        });

        animation.addEventListener("complete", () => {
          animation.goToAndStop(animation.totalFrames, true);
        });

        videoHotspotLottieAnimations.push(animation);
      });

      [infoHotspotLottie1, infoHotspotLottie2, ...osEndEndInfoHotspotLotties, ...isStartStartInfoHotspotLotties, ...boxBaseInfoHotspotLotties, ...osStartStartInfoHotspotLotties, ...isEndStartInfoHotspotLotties, ...isEndEndInfoHotspotLotties, ...osStartEndInfoHotspotLotties, ...starterInfoHotspotLotties].forEach((container, index) => {
        if (!container) return;

        const animation = lottie.loadAnimation({
          container,
          renderer: "svg",
          loop: true,
          autoplay: false,
          path: INFO_HOTSPOT_LOTTIE_PATH
        });

        animation.addEventListener("DOMLoaded", () => {
          setTimeout(() => {
            animation.play();
          }, index * INFO_HOTSPOT_REVEAL_STAGGER);
        });

        infoHotspotLottieAnimations.push(animation);
      });
    }

    function getSequenceFramePath(frameNumber, content = activeInfoContent) {
      const paddedFrame = String(frameNumber).padStart(3, "0");
      return `${content.sequenceFolder}${content.sequencePrefix}${paddedFrame}${SEQUENCE_EXTENSION}`;
    }

    function setSequenceFrame(frameNumber) {
      const totalFrames = SEQUENCE_LAST_FRAME - SEQUENCE_FIRST_FRAME + 1;
      let normalizedFrame = frameNumber;

      while (normalizedFrame > SEQUENCE_LAST_FRAME) {
        normalizedFrame -= totalFrames;
      }

      while (normalizedFrame < SEQUENCE_FIRST_FRAME) {
        normalizedFrame += totalFrames;
      }

      currentSequenceFrame = normalizedFrame;
      sequenceImage.src = getSequenceFramePath(currentSequenceFrame);
    }

    function preloadSequenceFrames(content) {
      for (let i = SEQUENCE_FIRST_FRAME; i <= SEQUENCE_LAST_FRAME; i++) {
        const img = new Image();
        img.src = getSequenceFramePath(i, content);
      }
    }

    function preloadAllSequenceFrames() {
      Object.values(INFO_CONTENT).forEach((content) => {
        preloadSequenceFrames(content);
      });
    }

    function easeInOutSine(value) {
      return -(Math.cos(Math.PI * value) - 1) / 2;
    }

    function startTouchGuideDemo() {
      if (touchGuideFrameId) {
        cancelAnimationFrame(touchGuideFrameId);
        touchGuideFrameId = null;
      }

      if (sequenceHasUserInteracted || !infoOverlay.classList.contains("open")) return;

      touchGuideStartFrame = currentSequenceFrame;
      touchGuideLastFrame = currentSequenceFrame;
      touchGuide.style.opacity = "0";
      touchGuide.style.transition = "opacity 1.1s ease";
      touchGuide.style.transform = "translate3d(-50%, -50%, 0)";

      const pathOffsets = [0, -TOUCH_GUIDE_MAX_OFFSET, TOUCH_GUIDE_MAX_OFFSET, -TOUCH_GUIDE_MAX_OFFSET, TOUCH_GUIDE_MAX_OFFSET];
      const totalMotionDuration = (pathOffsets.length - 1) * TOUCH_GUIDE_SWIPE_DURATION;
      const totalDuration = TOUCH_GUIDE_FADE_IN_DURATION + totalMotionDuration;
      const startTime = performance.now();

      requestAnimationFrame(() => {
        touchGuide.style.opacity = "1";
      });

      function animateTouchGuide(timestamp) {
        if (sequenceHasUserInteracted || !infoOverlay.classList.contains("open")) {
          stopTouchGuideDemo();
          return;
        }

        const elapsed = timestamp - startTime;
        const motionElapsed = Math.max(0, elapsed - TOUCH_GUIDE_FADE_IN_DURATION);
        const motionComplete = motionElapsed >= totalMotionDuration;

        let travel;

        if (motionComplete) {
          travel = pathOffsets[pathOffsets.length - 1];
        } else {
          const segmentIndex = Math.min(
            Math.floor(motionElapsed / TOUCH_GUIDE_SWIPE_DURATION),
            pathOffsets.length - 2
          );
          const rawSegmentProgress = Math.min(
            (motionElapsed % TOUCH_GUIDE_SWIPE_DURATION) / TOUCH_GUIDE_SWIPE_DURATION,
            1
          );
          const easedProgress = easeInOutSine(rawSegmentProgress);
          const fromOffset = pathOffsets[segmentIndex];
          const toOffset = pathOffsets[segmentIndex + 1];
          travel = fromOffset + (toOffset - fromOffset) * easedProgress;
        }

        const frameOffset = Math.round((travel / TOUCH_GUIDE_MAX_OFFSET) * TOUCH_GUIDE_FRAME_SWING);
        touchGuideLastFrame = touchGuideStartFrame + frameOffset;

        touchGuide.style.transform = `translate3d(calc(-50% + ${travel}px), -50%, 0)`;
        setSequenceFrame(touchGuideLastFrame);

        if (elapsed < totalDuration) {
          touchGuideFrameId = requestAnimationFrame(animateTouchGuide);
          return;
        }

        touchGuideFrameId = null;
        touchGuide.style.transform = `translate3d(calc(-50% + ${pathOffsets[pathOffsets.length - 1]}px), -50%, 0)`;
        setSequenceFrame(touchGuideLastFrame);
        touchGuide.style.opacity = "0";

        scheduleTouchGuideDemo(TOUCH_GUIDE_REPEAT_DELAY);
      }

      touchGuideFrameId = requestAnimationFrame(animateTouchGuide);
    }

    function scheduleTouchGuideDemo(delay = TOUCH_GUIDE_REPEAT_DELAY) {
      if (sequenceHasUserInteracted || !infoOverlay.classList.contains("open")) return;

      if (touchGuideRepeatTimer) {
        clearTimeout(touchGuideRepeatTimer);
        touchGuideRepeatTimer = null;
      }

      touchGuideRepeatTimer = setTimeout(() => {
        touchGuideRepeatTimer = null;
        if (!sequenceHasUserInteracted && infoOverlay.classList.contains("open")) {
          startTouchGuideDemo();
        }
      }, delay);
    }

    function stopTouchGuideDemo() {
      if (touchGuideFrameId) {
        cancelAnimationFrame(touchGuideFrameId);
        touchGuideFrameId = null;
      }

      if (touchGuideRepeatTimer) {
        clearTimeout(touchGuideRepeatTimer);
        touchGuideRepeatTimer = null;
      }

      touchGuide.style.opacity = "0";
      touchGuide.style.transform = "translate3d(-50%, -50%, 0)";
    }

    }

    function moveSequenceDrag(event) {
      if (!isDraggingSequence) return;

      const deltaX = event.clientX - lastDragX;
      lastDragX = event.clientX;

      dragAccumulator += deltaX;

      const pixelsPerFrame = 5;

      if (Math.abs(dragAccumulator) >= pixelsPerFrame) {
        const frameStep = Math.trunc(dragAccumulator / pixelsPerFrame);

        setSequenceFrame(currentSequenceFrame + frameStep);

        dragAccumulator = dragAccumulator % pixelsPerFrame;
      }

      event.preventDefault();
    }

    function endSequenceDrag(event) {
      if (!isDraggingSequence) return;

      isDraggingSequence = false;
      dragAccumulator = 0;
      sequencePanel.classList.remove("dragging");

      try {
        sequencePanel.releasePointerCapture(event.pointerId);
      } catch (error) {
        // Pointer may already be released.
      }
    }

    function playInfoLottie() {
      if (!window.lottie) {
        console.warn("Lottie/bodymovin is not loaded.");
        return;
      }

      if (infoLottieAnimation) {
        infoLottieAnimation.destroy();
        infoLottieAnimation = null;
      }

      infoLottieContainer.innerHTML = "";

      infoLottieAnimation = lottie.loadAnimation({
        container: infoLottieContainer,
        renderer: "svg",
        loop: false,
        autoplay: true,
        path: activeInfoContent.drawingLottiePath
      });

      infoLottieAnimation.setSpeed(1.3);

      infoLottieAnimation.addEventListener("complete", () => {
        infoLottieAnimation.goToAndStop(infoLottieAnimation.totalFrames, true);
      });
    }

    modelViewer.addEventListener("error", (event) => {
      console.error("Model-viewer error:", event);
    });
  </script>

</body>
